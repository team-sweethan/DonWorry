spring:
  application:
    name: donworry

  # 개인 PC 설정 파일이 있으면 자동으로 덮어쓴다 (없어도 됨)
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: jdbc:mariadb://${DONWORRY_DB_HOST:localhost}:${DONWORRY_DB_PORT:3307}/${DONWORRY_DB_NAME:donworry}
    username: ${DONWORRY_DB_USER:donworry}
    password: ${DONWORRY_DB_PASSWORD:donworry}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update              # Flyway 전환 전 임시 (ERD Baseline v1 나옴) — 전환 후 validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC            # ERD 공통 규칙: DATETIME(6)에 UTC 저장

  flyway:
    enabled: false                # 팀이 전환 시점을 정하면 true
    locations: classpath:db/migration

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true             # 이벤트 테이블을 Modulith가 생성 (Flyway 꺼진 동안)

server:
  port: ${DONWORRY_PORT:8081}       # CakeShop 8080과 겹치지 않게
