spring:
  application:
    name: donworry

  datasource:
    url: jdbc:mariadb://${DONWORRY_DB_HOST:localhost}:${DONWORRY_DB_PORT:3307}/${DONWORRY_DB_NAME:donworry}
    username: ${DONWORRY_DB_USER:donworry}
    password: ${DONWORRY_DB_PASSWORD:donworry}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 테이블은 Flyway만 만든다. Entity와 스키마가 어긋나면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC            # ERD 공통 규칙: DATETIME(6)에 UTC 저장

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true       # 이미 적용된 파일이 바뀌면 기동 실패
    clean-disabled: true            # flyway clean으로 DB가 통째로 지워지는 것을 막는다
    # 파일명 타임스탬프는 '만든 시각'이라 병합 순서와 다를 수 있다
    # 늦게 병합된 낮은 버전도 적용되게 허용한다 (의존 순서까지 보장하지는 않음)
    out-of-order: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false            # EVENT_PUBLICATION 테이블은 Flyway migration이 만든다

server:
  port: ${DONWORRY_PORT:8081}       # CakeShop 8080과 겹치지 않게
  # 로그인 이력 IP는 원 접속 주소만 쓴다 (ADR-0033). 값을 비워 두면 클라우드 환경 감지로
  # NATIVE가 켜질 수 있어 명시한다. 프록시 사용자 IP는 security.login-history.ip-mode=PROXY로 받는다.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m                 # 비활동 만료 (ADR-0014)
      cookie:
        http-only: true
        same-site: lax

donworry:
  scheduling:
    # 로그인 이력 90일 삭제 등 예약 작업. 테스트는 build.gradle에서 끄고 작업을 직접 호출한다.
    enabled: ${DONWORRY_SCHEDULING_ENABLED:true}

security:
  login-history:
    # PROXY는 관리 프록시가 X-DonWorry-Client-IP를 덮어쓰는 배포에서만 설정한다.
    ip-mode: ${DONWORRY_LOGIN_HISTORY_IP_MODE:DIRECT}
    trusted-proxies: ${DONWORRY_LOGIN_HISTORY_TRUSTED_PROXIES:}
  csrf:
    # 실제 활성화는 #68 5단계에서 다른 담당에게 공지한 뒤 진행한다.
    enabled: ${DONWORRY_CSRF_ENABLED:false}

fds:
  mock:
    # P5 요청이 아직 없는 로컬 화면용 Mock. P5 실연동 환경에서는 false로 끈다.
    seed-enabled: ${FDS_MOCK_SEED_ENABLED:true}

ai:
  server:
    # true면 고정 문장 보고서 대신 ai-server(Qwen)에 조사를 맡긴다. 기본은 꺼짐 — ai-server를 켜는 사람만 켠다
    enabled: ${AI_SERVER_ENABLED:false}
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # ai-server의 AI_SERVER_INTERNAL_API_KEY와 같은 값. 저장소에 적지 않는다
    api-key: ${AI_SERVER_API_KEY:}

---
spring:
  config:
    activate:
      on-profile: "!prod"
    # 운영에서는 개인 PC의 DB·쿠키 설정을 가져오지 않는다.
    import: optional:classpath:application-local.yml
