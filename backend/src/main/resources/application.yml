spring:
  application:
    name: donworry

  mail:
    host: ${DONWORRY_SMTP_HOST:localhost}
    port: ${DONWORRY_SMTP_PORT:1025}
    username: ${DONWORRY_SMTP_USERNAME:}
    password: ${DONWORRY_SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${DONWORRY_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${DONWORRY_SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${DONWORRY_SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000

  datasource:
    url: jdbc:mariadb://${DONWORRY_DB_HOST:localhost}:${DONWORRY_DB_PORT:3307}/${DONWORRY_DB_NAME:donworry}
    username: ${DONWORRY_DB_USER:donworry}
    password: ${DONWORRY_DB_PASSWORD:donworry}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate            # 테이블은 Flyway만 만든다. Entity와 스키마가 어긋나면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC            # ERD 공통 규칙: DATETIME(6)에 UTC 저장

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true       # 이미 적용된 파일이 바뀌면 기동 실패
    clean-disabled: true            # flyway clean으로 DB가 통째로 지워지는 것을 막는다
    # 파일명 타임스탬프는 '만든 시각'이라 병합 순서와 다를 수 있다
    # 늦게 병합된 낮은 버전도 적용되게 허용한다 (의존 순서까지 보장하지는 않음)
    out-of-order: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false            # EVENT_PUBLICATION 테이블은 Flyway migration이 만든다

server:
  port: ${DONWORRY_PORT:8081}       # CakeShop 8080과 겹치지 않게
  # 로그인 이력 IP는 원 접속 주소만 쓴다 (ADR-0033). 값을 비워 두면 클라우드 환경 감지로
  # NATIVE가 켜질 수 있어 명시한다. 프록시 사용자 IP는 security.login-history.ip-mode=PROXY로 받는다.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m                 # 비활동 만료 (ADR-0014)
      cookie:
        http-only: true
        same-site: lax

donworry:
  applications:
    enabled: ${DONWORRY_APPLICATIONS_ENABLED:true}
    public-base-url: ${DONWORRY_PUBLIC_BASE_URL:http://localhost:5173}
    mail-from: ${DONWORRY_MAIL_FROM:donworry@localhost}
  scheduling:
    # 로그인 이력 90일 삭제 등 예약 작업. 테스트는 build.gradle에서 끄고 작업을 직접 호출한다.
    enabled: ${DONWORRY_SCHEDULING_ENABLED:true}
  pii:
    # 주문자 연락처 암호화 · 지문 키 (#602, ADR-0082). 각각 32바이트 Base64, 서로 다른 값. 저장소에 적지 않는다
    # 비어 있으면 주문자 정보를 저장하지 않고 결제는 그대로 진행한다. 한 번 저장한 뒤 키를 바꾸면 기존 암호문을 못 읽는다
    encryption-key: ${DONWORRY_PII_ENCRYPTION_KEY:}
    hmac-key: ${DONWORRY_PII_HMAC_KEY:}
  insider:
    # 내부자 경보 기준값 (#516, ADR-0082) — 정상 업무를 재기 전 임시값이다. 측정 뒤 조정한다
    ins01-window: 10m                # INS-01 담당 밖 접근 반복: 이 시간 안에
    ins01-caution-cases: 3           #   서로 다른 사건 N개에서 거부되면 주의
    ins03-window: 1h                 # INS-03 원문 열람 집중: 이 시간 안에
    ins03-caution-raw-views: 3       #   주문자 전화 원문 N건이면 주의
    ins07-after-login: 30m           # INS-07 처음 보는 브라우저: 로그인 뒤 이 시간 안 원문 열람이고
    ins07-lookback: 30d              #   그 브라우저 · 운영체제가 이 기간 성공 로그인에 없으면 높음 (기록 없으면 울리지 않음)
    ins08-window: 1h                 # INS-08 업무 대비 대량 조회: 이 시간 안 거래 목록
    ins08-caution-rows: 1000         #   N행 이상이고
    ins08-max-linked-ratio: 0.3      #   담당 사건과 이어진 행이 이 비율 미만이면 주의
    ins09-window: 1h                 # INS-09 무관 고객 반복 검색: 이 시간 안 담당 사건에 없는
    ins09-caution-customers: 10      #   서로 다른 고객 번호 N명이면 주의
    scope-closed-lookback: 30d       # INS-08 · 09의 담당 사건 = 열린 사건 + 이 기간 안에 닫힌 사건
  payment-transactions:
    # 거래 내역 CSV 내보내기 한 번에 받을 수 있는 최대 행 수 (#651). 넘으면 잘라 주지 않고 거절한다(조건을 좁혀 다시)
    export-max-rows: 1000

security:
  login-history:
    # PROXY는 관리 프록시가 X-DonWorry-Client-IP를 덮어쓰는 배포에서만 설정한다.
    ip-mode: ${DONWORRY_LOGIN_HISTORY_IP_MODE:DIRECT}
    trusted-proxies: ${DONWORRY_LOGIN_HISTORY_TRUSTED_PROXIES:}
  csrf:
    # 브라우저 변경 요청은 기본 보호한다 (#408, ADR-0063).
    enabled: ${DONWORRY_CSRF_ENABLED:true}
  demo-api:
    # 인증 없는 시연용 API(/api/demo/held-payments)를 연다. 운영에서는 끈다 (#392)
    enabled: true

ai:
  server:
    # true면 고정 문장 보고서 대신 ai-server(Qwen)에 조사를 맡긴다. 기본은 꺼짐 — ai-server를 켜는 사람만 켠다
    enabled: ${AI_SERVER_ENABLED:false}
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # ai-server의 AI_SERVER_INTERNAL_API_KEY와 같은 값. 저장소에 적지 않는다
    api-key: ${AI_SERVER_API_KEY:}
  ml-shadow:
    # true면 커밋된 FDS 평가를 ai-server RF로 따로 채점해 ml_shadow_scores에 기록한다. 결제 판정에는 쓰지 않는다. 기본 꺼짐
    # ai.server.enabled(AI 조사)와 따로 켠다. 주소 · 서비스 키 · 응답 시간 초과는 ai.server 값을 같이 쓴다
    enabled: ${ML_SHADOW_ENABLED:false}
    interval: PT30S
    batch-size: 50
    settle-delay: PT30S
    max-attempts: 3
    # ai-server AI_SERVER_ML_MODEL_PATH의 파일 이름과 같아야 한다 (다르면 기록하지 않고 멈춘다)
    # 기본 rf-v2 (#450). rf-v1로 되돌릴 때는 양쪽을 함께 바꾼다
    model-version: ${ML_SHADOW_MODEL_VERSION:rf-v2}

---
spring:
  config:
    activate:
      on-profile: "!prod"
    # 운영에서는 개인 PC의 DB·쿠키 설정을 가져오지 않는다.
    import: optional:classpath:application-local.yml
