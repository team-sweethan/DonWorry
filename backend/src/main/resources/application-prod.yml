spring:
  main:
    lazy-initialization: false
  datasource:
    url: jdbc:mariadb://${DONWORRY_DB_HOST}:${DONWORRY_DB_PORT:3306}/${DONWORRY_DB_NAME}
    username: ${DONWORRY_DB_USER}
    password: ${DONWORRY_DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

security:
  demo-api:
    # 인증 없는 시연용 API를 운영에서 막는다 (#392, 시작 검사도 거절)
    enabled: false

donworry:
  applications:
    enabled: ${DONWORRY_APPLICATIONS_ENABLED:false}
