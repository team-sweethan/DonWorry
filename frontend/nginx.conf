# 화면 보안 헤더 (#801)
# 결제창(/checkout/*)은 가맹점 사이트 iframe 안에서 열리므로 끼워 넣기 제한을 붙이지 않는다 (ADR-0064).
# $request_uri(브라우저가 요청한 원래 주소)로 나눈다. try_files가 /index.html로 내부 이동해도 값이 바뀌지 않고,
# 화면 라우터도 브라우저 주소로 그릴 화면을 정하므로 이 주소가 /checkout/으로 시작하면 결제창만 그려진다.
# 값이 빈 문자열이면 nginx는 그 헤더를 보내지 않는다.
map $request_uri $donworry_frame_options {
    ~^/checkout/  "";
    default       "DENY";
}

map $request_uri $donworry_csp_frame_ancestors {
    ~^/checkout/  "";
    default       "frame-ancestors 'none'";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Nginx 상태 확인
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # 내부 관리 경로 외부 접근 차단
    location ~ ^/(actuator|docs|openapi\.json|internal)(/|$) {
        return 404;
    }

    location = /api {
        return 404;
    }

    # API 요청을 Spring Boot 컨테이너로 전달
    location ^~ /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-DonWorry-Client-IP $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # React SPA 라우팅
    # 보안 헤더는 이 location에만 둔다. /api/ 응답은 Spring Security가 같은 헤더를 붙이므로 겹치지 않게 한다.
    # location 안에 add_header가 하나라도 있으면 server 블록의 add_header를 물려받지 않는다 — 여기 모두 적는다.
    location / {
        # HTTPS만 쓰게 한다. 짧게 시작하고, 하위 도메인은 학원 소유라 includeSubDomains를 넣지 않는다
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options $donworry_frame_options always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        # 처음에는 막지 않고 위반만 기록한다. 화면 확인 뒤 Content-Security-Policy로 바꾼다.
        # style-src 'unsafe-inline': antd가 실행 중에 <style> 태그를 넣는다. img-src data:: global.css 상태 아이콘
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; $donworry_csp_frame_ancestors" always;

        try_files $uri $uri/ /index.html;
    }
}
