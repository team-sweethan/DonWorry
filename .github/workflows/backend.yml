name: backend
on:
  push:
    branches: [main, dev]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:                # PR은 항상 실행 — 필수 검사가 '대기 중'으로 멈추지 않게

jobs:
  backend:
    name: backend   # 필수 검사 이름 — 세 개가 겹치지 않게
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PR에서 backend/ 가 안 바뀌었으면 이후 단계를 건너뛰고 바로 통과 (push는 경로 필터로 이미 걸러짐)
      - id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(backend/|\.github/workflows/backend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "backend/ 변경 없음 — 검사 생략"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: steps.changes.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v4
      - if: steps.changes.outputs.run == 'true'
        run: chmod +x gradlew      # Windows에서 커밋해도 실행 권한 문제 없게
      - if: steps.changes.outputs.run == 'true'
        run: ./gradlew check       # 컴파일 + ModularityTests + ArchitectureTests
