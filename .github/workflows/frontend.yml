name: frontend
on:
  push:
    branches: [main, dev]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:                # PR은 항상 실행 — 필수 검사가 '대기 중'으로 멈추지 않게

jobs:
  frontend:
    name: frontend   # 필수 검사 이름 — 세 개가 겹치지 않게
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PR에서 frontend/ 가 안 바뀌었으면 이후 단계를 건너뛰고 바로 통과 (push는 경로 필터로 이미 걸러짐)
      - id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(frontend/|\.github/workflows/frontend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ 변경 없음 — 검사 생략"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint
      - if: steps.changes.outputs.run == 'true'
        run: npm run format:check
      - if: steps.changes.outputs.run == 'true'
        run: npm run test
      - if: steps.changes.outputs.run == 'true'
        run: npm run build         # 타입 검사 포함
