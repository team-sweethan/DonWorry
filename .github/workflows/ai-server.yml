name: ai-server
on:
  push:
    branches: [main, dev]
    paths: ['ai-server/**', '.github/workflows/ai-server.yml']
  pull_request:                # PR은 항상 실행 — 필수 검사가 '대기 중'으로 멈추지 않게

jobs:
  ai-server:
    name: ai-server   # 필수 검사 이름 — 세 개가 겹치지 않게
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --locked      # uv.lock과 어긋나면 실패
      - run: uv run ruff check .
      - run: uv run pytest
