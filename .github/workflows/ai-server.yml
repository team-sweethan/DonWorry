name: ai-server
on:
  push:
    branches: [main, dev]
    paths: ['ai-server/**', '.github/workflows/ai-server.yml']
  pull_request:                # PR은 항상 실행 — 필수 검사가 '대기 중'으로 멈추지 않게

jobs:
  ai-server:
    name: ai-server   # 필수 검사 이름 — 세 개가 겹치지 않게
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # PR에서 ai-server/ 가 안 바뀌었으면 이후 단계를 건너뛰고 바로 통과 (push는 경로 필터로 이미 걸러짐)
      - id: changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(ai-server/|\.github/workflows/ai-server\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ai-server/ 변경 없음 — 검사 생략"
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: steps.changes.outputs.run == 'true'
        run: pip install uv
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --locked      # uv.lock과 어긋나면 실패
      - if: steps.changes.outputs.run == 'true'
        run: uv run ruff check .
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest
