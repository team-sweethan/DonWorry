name: DonWorry VM Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 수동 검증은 자동 발행과 별도로 실행한다. 대기 실행은 교체하지 않아 오래된 실행의
# 재시도가 최신 배포를 취소하지 않게 한다. 오래된 SHA의 marker 발행은 아래에서 막는다 (#435).
# queue: max는 그룹당 최대 100개의 대기를 보존한다 (GitHub Actions concurrency).
concurrency:
  group: vm-images-${{ github.event_name }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/scripts -p 'test_release_*.py' -v

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew check
      # MariaDB 컨테이너에 Flyway 전체 적용 + JPA validate — 필수 검사 backend와 같은 기준
      - run: ./gradlew mariaDbTest

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  ai-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  images:
    needs: [release-checks, backend-test, frontend-test, ai-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true' }}
          tags: ghcr.io/team-sweethan/donworry-backend:sha-${{ github.sha }}

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true' }}
          tags: ghcr.io/team-sweethan/donworry-frontend:sha-${{ github.sha }}

      - name: Build AI
        uses: docker/build-push-action@v6
        with:
          context: ./ai-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true' }}
          tags: ghcr.io/team-sweethan/donworry-ai:sha-${{ github.sha }}

      # 느린 빌드·업로드는 최신 확인 전에 끝낸다. prod는 아직 변경하지 않는다 (#461).
      - name: Prepare release marker
        id: marker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/release-marker.Dockerfile
          push: true
          tags: ghcr.io/team-sweethan/donworry-release:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # marker는 revision label만 담는다. provenance를 붙이면 index로 발행되므로
          # 단일 manifest로 유지해 게시 스크립트의 digest 그대로 승격 전제와 맞춘다.
          provenance: false

      # 최신 확인과 digest 승격을 같은 스크립트에서 실행한다. main 병합을 잠그지는
      # 않으므로 확인 이후 변경에 대한 실제 배포 차단은 #448의 소비 측 검증이 필요하다.
      - name: Publish release marker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DONWORRY_RELEASE_ENABLED == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          MARKER_DIGEST: ${{ steps.marker.outputs.digest }}
        run: bash .github/scripts/publish-release-marker.sh
